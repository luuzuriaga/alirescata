services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: alirescata
      POSTGRES_USER: alirescata
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alirescata"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://alirescata:${DB_PASSWORD}@db:5432/alirescata
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:5173
      TZ: America/Lima
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:5173"
volumes:
  dbdata:
